services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: chen-stack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be explicitly configured}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be explicitly configured}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql/chen_stack.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - chen-stack-network
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --user=root --batch --skip-column-names --execute="SELECT 1" | grep -qx 1']
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: chen-stack-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME must be explicitly configured}
    volumes:
      - redis_data:/data
      - type: bind
        source: ${REDIS_SECURE_CONFIG_DIRECTORY:?REDIS_SECURE_CONFIG_DIRECTORY must be explicitly configured}
        target: /secure
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REDIS_HEALTH_PASSWORD_FILE:?REDIS_HEALTH_PASSWORD_FILE must be explicitly configured}
        target: /run/secrets/redis-health-password
        read_only: true
        bind:
          create_host_path: false
    command:
      - sh
      - -ec
      - |
        test -f /secure/redis.conf
        test -s /secure/redis.conf
        test -f /secure/users.acl
        test -s /secure/users.acl
        test -f /run/secrets/redis-health-password
        test -s /run/secrets/redis-health-password
        exec /usr/local/bin/docker-entrypoint.sh redis-server /secure/redis.conf
    networks:
      - chen-stack-network
    healthcheck:
      test: ["CMD-SHELL", 'test -f /run/secrets/redis-health-password && test -s /run/secrets/redis-health-password && REDISCLI_AUTH="$$(cat /run/secrets/redis-health-password)" redis-cli --user "$${REDIS_USERNAME}" -e ping | grep -qx PONG']
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 30s

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: chen-stack-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be explicitly configured}
      # 启用 MinIO Web 控制台
      MINIO_BROWSER: on
      MINIO_BROWSER_LOGIN_ANIMATION : on
      MINIO_BROWSER_SESSION_DURATION : 12h
      # 彻底禁用所有身份验证提供商
      MINIO_IDENTITY_OPENID_ENABLE: "false"
      MINIO_IDENTITY_LDAP_ENABLE: "false"
      MINIO_IDENTITY_PLUGIN_ENABLE: "false"
      # 配置区域设置
      MINIO_REGION: us-east-1
      # 强制跳过身份验证初始化
      MINIO_SKIP_CLIENT: "true"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001" --quiet
    networks:
      - chen-stack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      timeout: 20s
      retries: 3
      interval: 30s
      start_period: 20s

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chen-stack-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be explicitly configured}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - chen-stack-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 30s
      retries: 10
      interval: 10s
      start_period: 60s

# 数据卷
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local

# 网络
networks:
  chen-stack-network:
    driver: bridge
    name: chen-stack-network
